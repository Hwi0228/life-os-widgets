<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life OS Dashboard</title>
  <link rel="stylesheet" href="/static/css/modern_theme.css">
  <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
</head>
<body class="bg-soft-grid">

  <!-- Optional subtle overlay (disabled by default in modern mode) -->
  <div id="crt-overlay" class="crt-overlay"></div>

  <!-- Top OS Navigation Bar -->
  <div class="top-bar">
    <div class="logo">
      <span>✨ Life OS</span>
      <span class="team-badge">AI TEAM · GROK [T4]</span>
    </div>

    <div class="bar-controls">
      <button class="retro-btn" id="btn-sound-toggle">🔊 Sound</button>
      <button class="retro-btn" id="btn-crt-toggle">Scanlines: Off</button>
      <button class="retro-btn active-snap" id="btn-snap-toggle">Grid Snap: On</button>
      <button class="retro-btn" id="btn-theme-toggle">Theme</button>
      <button class="retro-btn" id="btn-save-layout">Save Layout</button>
      <span id="top-bar-clock" style="font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); min-width: 64px;">00:00:00</span>
    </div>
  </div>

  <!-- Desktop Canvas Workspace -->
  <div id="desktop-canvas">
    <!-- Windows rendered dynamically by JS -->
  </div>

  <!-- Bottom Dock for Quick Widget Toggles -->
  <div class="bottom-dock">
    <button class="retro-btn" onclick="LifeOS.toggleWidget('clock')">Clock</button>
    <button class="retro-btn" onclick="LifeOS.toggleWidget('quests')">Quests</button>
    <button class="retro-btn" onclick="LifeOS.toggleWidget('memos')">Memos</button>
    <button class="retro-btn" onclick="LifeOS.toggleWidget('stats')">Stats</button>
    <button class="retro-btn" onclick="LifeOS.toggleWidget('habits')">Habits</button>
  </div>

  <!-- Core Scripts & Widget Modules -->
  <script src="/static/js/app.js"></script>
  <script src="/static/js/widgets/clock_widget.js"></script>
  <script src="/static/js/widgets/quest_widget.js"></script>
  <script src="/static/js/widgets/memo_widget.js"></script>
  <script src="/static/js/widgets/stats_widget.js"></script>
  <script src="/static/js/widgets/habit_widget.js"></script>

</body>
</html>
